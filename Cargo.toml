[workspace]
resolver = "3"
members = [
    "crates/ui",
    "crates/mxm-editor",
    "crates/mxm-preset",
    "crates/mxm-params",
    "crates/mxm-telemetry",
    "crates/mxm-rng",
    "crates/mxm-dsp",
    "crates/mxm-modulation",
    "crates/mxm-modulation-params",
    "crates/mxm-tempo",
    "crates/mxm-keys",
    "crates/mxm-part-routing",
    "crates/mxm-drum-engine",
    "crates/mxm-control-map",
    "crates/mxm-audio-file",
    "crates/mxm-audio-file-decode",
    "crates/mxm-measure",
    "crates/mxm-plugin-test",
    "crates/mxm-xtask",
    "crates/mxm-vst3-host",
    "crates/mxm-fft",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.95"        # the GUI floor; crates that do not need it override downward
license = "MIT"
authors = ["mxm"]
repository = "https://github.com/mxm-audio/mxm-kit"

[workspace.dependencies]
# Pinned exactly, as in every MXM repository; Cargo.lock is committed.
# default-features = false drops `vst3` (a plugin turns it on to export a VST3, and the checks
# in `mxm-plugin-test` to read one) and `tracing-subscriber` (a plugin must not install a global
# subscriber into its host).
nice-plug = { version = "=0.4.2", default-features = false, features = ["editor", "assert_process_allocs"] }
egui = "=0.36.1"
nice-plug-egui = { version = "=0.5.1", default-features = false, features = ["opengl"] }

mxm-ui = { path = "crates/ui" }
mxm-editor = { path = "crates/mxm-editor" }
mxm-preset = { path = "crates/mxm-preset" }
mxm-params = { path = "crates/mxm-params" }
mxm-rng = { path = "crates/mxm-rng" }
mxm-dsp = { path = "crates/mxm-dsp" }
mxm-telemetry = { path = "crates/mxm-telemetry" }
mxm-modulation = { path = "crates/mxm-modulation" }
mxm-modulation-params = { path = "crates/mxm-modulation-params" }
mxm-tempo = { path = "crates/mxm-tempo" }
mxm-keys = { path = "crates/mxm-keys" }
mxm-part-routing = { path = "crates/mxm-part-routing" }
mxm-drum-engine = { path = "crates/mxm-drum-engine" }
mxm-control-map = { path = "crates/mxm-control-map" }
mxm-audio-file = { path = "crates/mxm-audio-file" }
mxm-audio-file-decode = { path = "crates/mxm-audio-file-decode" }
mxm-measure = { path = "crates/mxm-measure" }
mxm-plugin-test = { path = "crates/mxm-plugin-test" }
mxm-xtask = { path = "crates/mxm-xtask" }
mxm-vst3-host = { path = "crates/mxm-vst3-host" }
mxm-fft = { path = "crates/mxm-fft" }

[profile.release]
lto = "thin"
strip = "symbols"

# The rulers (the FFT) are measurement, not shipped code; every crate that measures sound pays for
# them unoptimised.
[profile.dev.package.mxm-measure]
opt-level = 3

# The FFT under mxm-fft: its 2^22-point tests would take minutes unoptimised. A consumer sets the
# same in its own root, because Cargo reads only the root workspace's profiles.
[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# nice-plug and egui-baseview as published plus the patches in each fork's PATCHES.md, as every
# repository that builds a plugin patches them: `mxm-editor` builds nice-plug-egui, so the kit tests
# it on the window stack that ships.
[patch.crates-io]
nice-plug = { git = "https://github.com/mxm-audio/nice-plug", branch = "main" }
egui-baseview = { git = "https://github.com/mxm-audio/egui-baseview", branch = "main" }
