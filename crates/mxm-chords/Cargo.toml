[package]
name = "mxm-chords"
description = "Chord theory for a tracker: qualities, names typed and spelled, naming played notes, voicing with voice leading, and stepping through a key's chords"
version.workspace = true
edition.workspace = true
# No dependency but serde, behind a feature, so a host, a web build (wasm32) or any crate can take
# it without inheriting the 1.95 GUI floor.
rust-version = "1.87"
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Qualities read and written as the tutti format's strings (`maj7`, `min7b5`, `13`).
serde = ["dep:serde"]

[dependencies]
serde = { version = "=1.0.229", optional = true }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
