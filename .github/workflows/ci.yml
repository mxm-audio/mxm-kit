name: CI

on:
  # Only by hand, from the Actions tab (the owner, 2026-10-07: pre-alpha, development speed
  # first, no tags). Pushes and pull requests start nothing.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Pinned, and moved on purpose: a new stable's lints must not turn a green tree red
      # overnight under `-D warnings`. The floor the crates declare is checked separately (MSRV).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libx11-xcb-dev libxcursor-dev libxkbcommon-dev libgl1-mesa-dev mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
